name: VM - Virtual Machine Connect (By minhhau_dev)

on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # 1. Cấu hình VM & Firewall
      - name: Cấu Hình VM & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      # 2. Tạo User
      - name: Tạo User VM
        run: |
          $username = "minhhau_dev"
          $password = "Hoangminhhau12345@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          "VM_USER_CREATED=true" >> $env:GITHUB_ENV

      # 3. Kết nối Tailscale
      - name: Kết Nối Tailscale
        run: |
          choco install tailscale -y --no-progress
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-vm-$env:GITHUB_RUN_ID --timeout=60s
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          "TAILSCALE_CONNECTED=true" >> $env:GITHUB_ENV
          Write-Host "VM IP: $tsIP"

      # 4. Duy trì phiên VM (5h45m)
      - name: Duy Trì VM (5h 45m)
        run: Start-Sleep -Seconds (345 * 60)

      # 5. Dọn dẹp
      - name: Dọn Dẹp VM
        if: always()
        run: |
          if ("$env:TAILSCALE_CONNECTED" -eq "true") {
            & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
          }
          if ("$env:VM_USER_CREATED" -eq "true") {
            Remove-LocalUser -Name "minhhau_dev" -ErrorAction SilentlyContinue
          }
